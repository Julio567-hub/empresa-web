<h2>Nuestros servicios</h2>

@if (cargando()) {
  <p>Cargando servicios…</p>
} @else {
  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (servicio of servicios(); track servicio.id) {
      <div class="col">
        <app-servicio-card [servicio]="servicio"></app-servicio-card>
      </div>
    }
  </div>
}
